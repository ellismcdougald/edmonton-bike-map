<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bike Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/htmx.org"></script>
  </head>
  <body>
    <h1>Edmonton Bike Map</h1>
    <div id="map"></div>

    <button type="button" id="selectStartButton">Select Start Location</button>
    <button type="button" id="selectEndButton">Select End Location</button>
    <button type="button" id="findRouteButton">Find Route</button>
    <button type="button" id="resetButton">Reset</button>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
