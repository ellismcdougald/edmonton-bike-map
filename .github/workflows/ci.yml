name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.js

  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Run tests
        run: go test -v ./...
        working-directory: backend

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin latest
      - name: golangci-lint
        run: golangci-lint run ./...
        working-directory: backend

  go-format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: Check Go code formatting
        run: |
          if ! gofmt -l . | grep .; then
            echo "All files are formatted"
          else
            echo "Some files need formatting. Run 'gofmt -w .' to fix."
            exit 1
          fi
        working-directory: backend

  node:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Check formatting
        run: npm run format -- --check
        working-directory: ./frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend
      - name: Run Vitest unit tests
        run: npm run test:unit -- --run
        working-directory: ./frontend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER testuser WITH PASSWORD 'testpass';"
          sudo -u postgres psql -c "CREATE DATABASE bikemap_test OWNER testuser;"
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install frontend deps
        run: |
          npm ci
          npx playwright install
        working-directory: ./frontend
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..50}; do
            if pg_isready -h localhost -p 5432 -U testuser; then
              echo "Postgres is ready!"
              break
            fi
            echo "Still waiting..."
            sleep 2
          done
      - name: Install golang-migrate CLI
        run: |
          version=v4.18.3
          curl -L https://github.com/golang-migrate/migrate/releases/download/$version/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          sudo chmod +x /usr/local/bin/migrate
      - name: Run DB migrations
        run: |
          export DATABASE_URL="postgres://testuser:testpass@localhost:5432/bikemap_test?sslmode=disable"
          migrate -path ./migrations -database "$DATABASE_URL" up
        working-directory: backend
      - name: Populate test database
        run: |
          export DATABASE_URL="postgres://testuser:testpass@localhost:5432/bikemap_test?sslmode=disable"
          go run cmd/populate_test_db/main.go
        working-directory: backend
      - name: Start backend server
        run: |
          export DATABASE_URL="postgres://testuser:testpass@localhost:5432/bikemap_test?sslmode=disable"
          go run cmd/server/main.go &
          echo $! > backend.pid
        working-directory: backend
      - name: Run E2E tests
        run: |
          npm run test:e2e -- --timeout 30000
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8080
          POSTGRES_TEST_USER: testuser
          POSTGRES_TEST_PASSWORD: testpass
          POSTGRES_TEST_DB: bikemap_test
          POSTGRES_TEST_PORT: 5432
      - name: Stop backend server
        if: always()
        run: |
          kill $(cat backend.pid) || true
