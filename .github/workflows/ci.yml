name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Run tests
        run: go test -v ./...

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1

  go-format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24
      - name: Check Go code formatting
        run: |
          if ! gofmt -l . | grep .; then
            echo "All files are formatted"
          else
            echo "Some files need formatting. Run 'gofmt -w .' to fix."
            exit 1
          fi

  node-install:
    name: Install Node.js dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

  node-format:
    name: Check formatting
    runs-on: ubuntu-latest
    needs: node-install
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Check formatting with Prettier
        run: npm run format -- --check
        working-directory: ./frontend

  node-lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: node-install
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

  node-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: node-install
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run Vitest
        run: npm run test:unit -- --run
        working-directory: ./frontend
