version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bike-map-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: ci_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testuser"]
      interval: 2s
      retries: 10
