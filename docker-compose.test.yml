services:
  test-db:
    image: postgis/postgis:16-3.4
    restart: always
    shm_size: 256mb
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-migrate:
    image: migrate/migrate
    command: >
      -path /migrations
      -database ${TEST_DATABASE_URL}
      up
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      test-db:
        condition: service_healthy

  test-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=test
      - DATABASE_URL=${TEST_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      test-db:
        condition: service_healthy
      test-migrate:
        condition: service_completed_successfully

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
      args:
        VITE_API_URL: ${API_URL}
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
    depends_on:
      - test-backend

volumes:
  postgres_test_data:
