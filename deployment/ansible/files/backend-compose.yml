services:
  backend:
    image: ghcr.io/ellismcdougald/edmonton-bike-backend:latest
    container_name: edmonton_bike_map_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8080:8080"

  migrate:
    image: ghcr.io/ellismcdougald/edmonton-bike-backend:latest
    env_file: .env
    entrypoint: ["sh", "-c", "echo $DATABASE_URL"]
    restart: "no"
