services:
  backend:
    image: ghcr.io/ellismcdougald/edmonton-bike-backend:latest
    container_name: edmonton_bike_map_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.edmontonbikemap.xyz`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

  migrate:
    image: ghcr.io/ellismcdougald/edmonton-bike-backend:latest
    env_file: .env
    entrypoint:
      [
        "/app/migrate",
        "-path=/app/migrations",
        "-database=${DATABASE_URL}",
        "up",
      ]
    restart: "no"

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LE_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  update-db-cron:
    image: ghcr.io/ellismcdougald/edmonton-bike-backend:latest
    container_name: update_db_cron
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    command: /bin/sh -c "echo '0 3 * * 0 /app/update_db >> /var/log/update_db.log 2>&1' | crontab - && crond -f -l 2"
    volumes:
      - /root/app/logs:/var/log
