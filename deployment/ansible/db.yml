---
- name: Deploy Postgres DB on droplet
  hosts: general
  become: yes
  collections:
    - community.docker
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Create Docker CLI plugins directory
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    - name: Download Docker Compose v2 binary
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"
        force: no

    - name: Ensure app directory exists
      file:
        path: /root/app
        state: directory

    - name: Copy .env file to server
      copy:
        src: .env
        dest: /root/app/.env
        mode: "0644"

    - name: Copy db-compose.yml to server
      copy:
        src: db-compose.yml
        dest: /root/app/db-compose.yml
        mode: "0644"

    - name: Deploy db with Compose
      community.docker.docker_compose_v2:
        project_src: /root/app
        state: present
        pull: always
        recreate: never
        files:
          - db-compose.yml

    - name: Wait for Postgres readiness
      shell: |
        set -a; . /root/app/.env; set +a
        for i in {1..30}; do
          if docker exec edmonton_bike_map_db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
            echo "Postgres is ready!"
            exit 0
          fi
          echo "Waiting for Postgres..."
          sleep 2
        done
        exit 1

    - name: Enable PostGIS extension
      shell: |
        set -a; . /root/app/.env; set +a
        docker exec edmonton_bike_map_db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
